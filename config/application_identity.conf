# Linux 主应用身份。canonical desktop ID、XDG 命名空间、WM Class 和通知通道均由它派生。
APPLICATION_ID=com.dongpl.linglong-store.v2

# 玲珑（UAB）轨道的独立应用身份。
#
# 必须与主身份不同：两种发行形态共用同一 ID 时，desktop 文件名、图标名、数据目录与
# 单实例锁全部相撞，DEB 已占用 /usr/share/applications/<id>.desktop 后玲珑包不会覆盖，
# 启动器里只会剩一个入口。后缀沿用玲珑生态惯例（如 com.github.another-redis.linyaps）。
LINYAPS_APPLICATION_ID=com.dongpl.linglong-store.v2.linyaps

# Stable 保留的隐藏 desktop 兼容入口；多个 ID 使用英文逗号分隔。
STABLE_COMPAT_DESKTOP_IDS=linglong-store.desktop

# Nightly 保留的隐藏 desktop 兼容入口；多个 ID 使用英文逗号分隔。
NIGHTLY_COMPAT_DESKTOP_IDS=linglong-store-nightly.desktop
